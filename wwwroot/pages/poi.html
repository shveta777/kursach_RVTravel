<div class="page-header">
    <h2>📍 Точки интереса</h2>
    <button class="btn btn-primary" onclick="showCreatePOIModal()" id="create-poi-btn">
        ➕ Добавить POI
    </button>
</div>

<div class="filters card">
    <div class="filter-row">
        <div class="form-group">
            <label>Тип</label>
            <select id="poi-type-filter" onchange="filterPOI()">
                <option value="">Все типы</option>
                <option value="RV Park">RV Park</option>
                <option value="Campground">Кемпинг</option>
                <option value="Gas Station">Заправка</option>
                <option value="Rest Area">Зона отдыха</option>
                <option value="Viewpoint">Смотровая площадка</option>
                <option value="Repair">СТО</option>
                <option value="Dump Station">Сливная станция</option>
            </select>
        </div>
        <div class="form-group">
            <label>Поиск</label>
            <input type="text" id="poi-search" placeholder="Название или адрес..." oninput="filterPOI()">
        </div>
    </div>
</div>

<div class="poi-layout">
    <div class="poi-map-container">
        <div id="poi-map" style="height: 600px;"></div>
    </div>
    <div class="poi-list-container">
        <div id="poi-list" class="poi-scrollable-list">
            <div class="loading">Загрузка...</div>
        </div>
    </div>
</div>

<!-- Шаблон карточки POI -->
<template id="poi-card-template">
    <div class="poi-item" onclick="focusPOI(this.dataset.id)">
        <div class="poi-icon"></div>
        <div class="poi-info">
            <h4 class="poi-name"></h4>
            <p class="poi-address"></p>
            <div class="poi-rating">
                <span class="stars"></span>
                <span class="reviews-count"></span>
            </div>
        </div>
    </div>
</template>
