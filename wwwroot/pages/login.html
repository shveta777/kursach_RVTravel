<div class="auth-container">
    <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchAuthTab('login')">Вход</button>
        <button class="auth-tab" onclick="switchAuthTab('register')">Регистрация</button>
    </div>

    <!-- Форма входа -->
    <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required placeholder="your@email.com">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Войти</button>
        <p class="auth-hint">Нет аккаунта? <a href="#" onclick="switchAuthTab('register')">Зарегистрируйтесь</a></p>
    </form>

    <!-- Форма регистрации -->
    <form id="register-form" class="auth-form hidden" onsubmit="handleRegister(event)">
        <div class="form-row">
            <div class="form-group">
                <label>Имя</label>
                <input type="text" name="firstName" required>
            </div>
            <div class="form-group">
                <label>Фамилия</label>
                <input type="text" name="lastName">
            </div>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required placeholder="your@email.com">
        </div>
        <div class="form-group">
            <label>Телефон</label>
            <input type="tel" name="phone" placeholder="+7 (999) 123-45-67">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" required minlength="6" placeholder="Минимум 6 символов">
        </div>
        <div class="form-group">
            <label>Подтвердите пароль</label>
            <input type="password" name="confirmPassword" required placeholder="Повторите пароль">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
        <p class="auth-hint">Уже есть аккаунт? <a href="#" onclick="switchAuthTab('login')">Войдите</a></p>
    </form>
</div>
