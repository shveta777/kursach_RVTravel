<div class="route-detail-layout">
    <div class="route-info card">
        <div class="route-detail-header">
            <h2 id="detail-route-title">Загрузка...</h2>
            <div class="route-badges">
                <span class="badge" id="detail-route-visibility"></span>
            </div>
        </div>
        <p id="detail-route-description"></p>
        <div class="route-author-info">
            <span>👤 Создатель: <span id="detail-route-author"></span></span>
            <span>📅 Создан: <span id="detail-route-date"></span></span>
        </div>
    </div>

    <div class="route-map-container card">
        <div id="route-detail-map" style="height: 500px;"></div>
    </div>

    <div class="route-points card">
        <h3>📍 Точки маршрута</h3>
        <div id="route-points-list" class="points-timeline">
            <!-- Точки загружаются JS -->
        </div>
    </div>
</div>
