<div class="page-header">
    <h2>🚐 Мой автодом</h2>
    <button class="btn btn-primary" onclick="showCreateRVModal()">
        ➕ Добавить RV
    </button>
</div>

<div id="rv-empty" class="card welcome hidden">
    <h3>У вас пока нет добавленных автодомов</h3>
    <p>Добавьте информацию о вашем RV для планирования маршрутов с учётом габаритов</p>
    <button class="btn btn-primary" onclick="showCreateRVModal()">Добавить RV</button>
</div>

<div id="rv-list" class="grid">
    <div class="loading">Загрузка...</div>
</div>

<!-- Шаблон карточки RV -->
<template id="rv-card-template">
    <div class="card rv-card">
        <div class="rv-header">
            <h3 class="rv-name"></h3>
            <div class="rv-actions-dropdown">
                <button class="btn-icon" onclick="toggleDropdown(this)">⋮</button>
                <div class="dropdown-menu hidden">
                    <button onclick="editRV(this.dataset.id)">✏️ Редактировать</button>
                    <button onclick="deleteRV(this.dataset.id)">🗑️ Удалить</button>
                </div>
            </div>
        </div>
        <div class="rv-specs">
            <div class="spec">
                <span class="spec-label">Марка/Модель</span>
                <span class="spec-value brand-model"></span>
            </div>
            <div class="spec">
                <span class="spec-label">Длина</span>
                <span class="spec-value length"></span>
            </div>
            <div class="spec">
                <span class="spec-label">Высота</span>
                <span class="spec-value height"></span>
            </div>
            <div class="spec">
                <span class="spec-label">Ширина</span>
                <span class="spec-value width"></span>
            </div>
            <div class="spec">
                <span class="spec-label">Вес</span>
                <span class="spec-value weight"></span>
            </div>
        </div>
        <div class="rv-footer">
            <span class="rv-date">Добавлен: <span class="date-value"></span></span>
            <button class="btn btn-primary btn-use" onclick="selectRV(this.dataset.id)">
                ✓ Использовать
            </button>
        </div>
    </div>
</template>
